name: CI Workflow

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main

jobs:
  run-custom-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run custom Next.js action
        uses: renzonj/NEXT_CUSTOM_ACTIONS@1.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
